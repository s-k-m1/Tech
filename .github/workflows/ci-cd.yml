name: SK Tech CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  DB_NAME: sk_tech_test
  DB_USER: sk_tech
  DB_PASSWORD: sk_tech
  DB_HOST: localhost
  DB_PORT: "5432"
  REDIS_URL: redis://localhost:6379/1

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install flake8 black isort
      - run: flake8 backend/ --max-line-length=120 --exclude=*/migrations/*
      - run: black --check backend/ --line-length=120
      - run: isort --check-only backend/ --profile black --line-length=120

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sk_tech_test
          POSTGRES_USER: sk_tech
          POSTGRES_PASSWORD: sk_tech
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r backend/requirements/dev.txt
      - run: cd backend && python manage.py test --verbosity=2

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run test || echo "No tests configured yet"

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/backend.Dockerfile -t sk-tech-backend:test .
      - run: docker build -f infra/docker/frontend.Dockerfile -t sk-tech-frontend:test .
      - run: docker build -f infra/docker/celery.Dockerfile -t sk-tech-celery:test .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit safety
      - run: bandit -r backend/ -x backend/tests -ll
      - run: safety check -r backend/requirements/base.txt

  deploy:
    name: Deploy to Production
    needs: [backend-lint, backend-test, frontend-lint, frontend-test, docker-build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /app/sk
            git pull origin main
            docker compose -f infra/docker-compose.prod.yml build
            docker compose -f infra/docker-compose.prod.yml up -d
            docker compose -f infra/docker-compose.prod.yml exec backend python manage.py migrate --noinput
            docker compose -f infra/docker-compose.prod.yml exec backend python manage.py collectstatic --noinput
            docker system prune -f
