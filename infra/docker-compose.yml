version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - ../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - ../backend/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sk_tech"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  celery:
    build:
      context: ..
      dockerfile: infra/docker/celery.Dockerfile
    volumes:
      - ../backend:/app
    env_file:
      - ../backend/.env
    depends_on:
      - backend
      - redis
      - postgres
    restart: unless-stopped

  celery-beat:
    build:
      context: ..
      dockerfile: infra/docker/celery-beat.Dockerfile
    volumes:
      - ../backend:/app
    env_file:
      - ../backend/.env
    depends_on:
      - backend
      - redis
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
